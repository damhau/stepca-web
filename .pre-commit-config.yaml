repos:
  # Block commits that contain keys, passwords or tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks
  # Lint with the same ruff version and rules as CI
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
  # Type check with the project's own environment (it needs the dependencies' types)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # The frontend's own checks, when frontend/ changes (needs `npm ci` in frontend/ once)
      - id: frontend
        name: frontend lint, format and types
        entry: sh -c 'cd frontend && npm run -s lint && npm run -s format:check && npm run -s typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
