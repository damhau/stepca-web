name: CI

on:
  push:
  pull_request:

env:
  # uv.lock was resolved with exclude-newer = "7 days" (only packages published at least a week
  # earlier); uv records that setting in the lock, so CI must use it too or the lock looks stale
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  test:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

  e2e:
    name: End-to-end (${{ matrix.dockerfile }}, ${{ matrix.identity }} identity)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            identity: admin
          - dockerfile: Dockerfile.pip
            identity: super
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: tests/e2e/run.sh
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          E2E_IDENTITY: ${{ matrix.identity }}
