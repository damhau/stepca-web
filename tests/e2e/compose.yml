# End-to-end stack: step-ca on PostgreSQL, stepca-web on a read-only role, and an OpenLDAP
# server for the LDAP login tests. Started by run.sh.
name: stepca-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: step-ca
      POSTGRES_PASSWORD: test
      POSTGRES_DB: step_ca_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "step-ca"]
      interval: 2s
      retries: 15

  step-ca:
    image: smallstep/step-ca:0.30.2
    volumes:
      - step:/home/step
    depends_on:
      db:
        condition: service_healthy

  # Test directory (ldap/50-directory.ldif) over ldap:// with StartTLS (389) and ldaps:// (636),
  # with a certificate from a test CA (ldap/make_certs.py) for the names openldap and localhost
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: E2E
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: adminpw
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      # No client certificates
      LDAP_TLS_VERIFY_CLIENT: never
    ports:
      - "127.0.0.1:${E2E_LDAP_PORT:-15389}:389"
      - "127.0.0.1:${E2E_LDAPS_PORT:-15636}:636"
    volumes:
      - ./work/ldap-certs:/container/service/slapd/assets/certs
      - ./ldap/40-read-access.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/40-read-access.ldif:ro
      - ./ldap/50-directory.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-directory.ldif:ro

  stepca-web:
    build:
      context: ../..
      dockerfile: ${DOCKERFILE:-Dockerfile}
    env_file: work/app.env
    ports:
      - "127.0.0.1:${E2E_PORT:-15000}:5000"
    volumes:
      - web-data:/data
      - ./work/local_users.json:/data/local_users.json:ro
      - ./work/secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  step: {}
  web-data: {}
