services:
  stepca-web:
    build:
      context: .
      # Dockerfile (uv) or Dockerfile.pip (plain pip)
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: stepca-web:latest
    container_name: stepca-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Signs the session cookie: required, the same for every worker and restart
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Password of the app's provisioner: its key is decrypted in memory (see README, CA identity)
      CA_ADMIN_PASSWORD_FILE: /run/secrets/ca_admin_password
    ports:
      # Bound to localhost by default: put a TLS reverse proxy in front before
      # exposing it, or set STEPCA_WEB_BIND=0.0.0.0
      - "${STEPCA_WEB_BIND:-127.0.0.1}:${STEPCA_WEB_PORT:-5000}:5000"
    secrets:
      - ca_admin_password
    volumes:
      # Working directory: admin.crt/admin.key, ca_root.crt and the app's SQLite database
      - stepca-web-data:/data
      # Users for AUTH_BACKEND=local (see README)
      # - ./local_users.json:/data/local_users.json:ro
      # CA of the LDAP server's certificate, for LDAP_CA_FILE=/data/ldap-ca.crt
      # - ./ldap-ca.crt:/data/ldap-ca.crt:ro
    extra_hosts:
      # Lets the container reach a step-ca / PostgreSQL running on the host
      - "host.docker.internal:host-gateway"
      # CA_URL must use one of the CA's DNS names (TLS is verified), e.g.
      # - "ca.example.com:host-gateway"

secrets:
  ca_admin_password:
    # Must be readable by uid 1000
    file: ./ca_admin_password.txt

volumes:
  stepca-web-data:
