<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/static/assets/css/adminlte.min.css">
  <title>StepCA Admin - Sign in</title>
</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <i class="fas fa-shield-alt mr-2"></i><b>StepCA</b> Admin
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        {% include "includes/flashes.html" %}
        <p class="login-box-msg">
          {% if error %}
          <span class="text-danger">{{ error }}</span>
          {% else %}
          Sign in with your credentials
          {% endif %}
        </p>
        <form method="post" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="input-group mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" aria-label="Username" autocomplete="username" required autofocus>
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-user"></span></div>
            </div>
          </div>
          <div class="input-group mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
            <div class="input-group-append">
              <div class="input-group-text"><span class="fas fa-lock"></span></div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
