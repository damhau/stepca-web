{# Revoke dialog. Buttons that open it set data-cert-id (and optionally data-cert-subject). #}
<div class="modal fade" id="revokeModal" tabindex="-1" role="dialog" aria-labelledby="revokeModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <form method="POST" action="{{ url_for('x509.revoke_cert') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="cert_id" id="modal_cert_id">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="revokeModalLabel">Revoke Certificate</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">Serial <code id="modal_cert_serial"></code><br><span id="modal_cert_subject" class="text-muted"></span></p>
          <div class="form-group">
            <label for="revokeReason">Reason</label>
            <select class="form-control" id="revokeReason" name="reason">
              {% for code, label in revocation_reasons %}
              <option value="{{ code }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="revokePassphrase">Provisioner Passphrase</label>
            <input type="password" class="form-control" id="revokePassphrase" name="passphrase" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Revoke</button>
        </div>
      </div>
    </form>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    $('#revokeModal').on('show.bs.modal', function (event) {
      const button = $(event.relatedTarget);
      $('#modal_cert_id').val(button.data('cert-id'));
      document.getElementById('modal_cert_serial').textContent = button.data('cert-id');
      document.getElementById('modal_cert_subject').textContent = button.data('cert-subject') || '';
    });
  });
</script>
