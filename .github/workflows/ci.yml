name: CI

on:
  push:
  pull_request:

env:
  # uv.lock was resolved with exclude-newer = "7 days" (only packages published at least a week
  # earlier); uv records that setting in the lock, so CI must use it too or the lock looks stale
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  test:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt
      - name: frontend/openapi.json is the API's current OpenAPI document
        run: |
          uv run python -m app.api.openapi
          git diff --exit-code frontend/openapi.json

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: The API types are generated from frontend/openapi.json
        run: |
          npm run api:gen
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (${{ matrix.dockerfile }}, ${{ matrix.identity }} identity)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            identity: admin
          - dockerfile: Dockerfile.pip
            identity: super
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # For the browser tests (tests/e2e/test_browser.py)
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: tests/e2e/run.sh
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          E2E_IDENTITY: ${{ matrix.identity }}
