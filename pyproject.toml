[project]
name = "stepca-web"
version = "0.1.0"
description = "Web dashboard for managing a Step CA certificate authority"
readme = "README.md"
# PEP 701 f-strings are used in the routes
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",
    "flask>=3.1",
    "flask-limiter>=3.12",
    "flask-openapi3>=4.3",
    "flask-sqlalchemy>=3.1",
    "flask-talisman>=1.1",
    "flask-wtf>=1.2",
    "gunicorn>=23",
    "jwcrypto>=1.5",
    "ldap3>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "playwright>=1.55",
    "pytest>=8",
    "ruff>=0.12",
    "types-jwcrypto>=1.6.1.20260928",
    "types-ldap3>=2.9.13.20260827",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
# An application, not a library: install the dependencies only
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Function bodies are checked even where the function has no annotations
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships type information
module = ["flask_talisman", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Flask-SQLAlchemy creates db.Model at runtime, which mypy can't follow as a base class
module = ["app.models.*"]
disable_error_code = ["name-defined"]
