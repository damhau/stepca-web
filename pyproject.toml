[project]
name = "stepca-web"
version = "0.1.0"
description = "Web dashboard for managing a Step CA certificate authority"
readme = "README.md"
# PEP 701 f-strings are used in the routes
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",
    "flask>=3.1",
    "flask-limiter>=3.12",
    "flask-sqlalchemy>=3.1",
    "flask-talisman>=1.1",
    "flask-wtf>=1.2",
    "gunicorn>=23",
    "jwcrypto>=1.5",
    "ldap3>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.uv]
# An application, not a library: install the dependencies only
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
